<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Это для тебя</title>
<style>
:root{--bg:#f6ecdf;--bg2:#ead9c3;--fg:#6b1020;--red:#9b1b30;--card:#fffaf2;--soft:#e8c9c4;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b0a12;--bg2:#3d1019;--fg:#ffdfe3;--red:#d4475c;--card:#4a1822;--soft:#6a2a36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b0a12;--bg2:#3d1019;--fg:#ffdfe3;--red:#d4475c;--card:#4a1822;--soft:#6a2a36;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--fg);font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 30% 20%,var(--bg),var(--bg2));display:flex;justify-content:center;align-items:center;padding:20px 16px;text-align:center}
main{width:100%;max-width:440px}
.screen{display:none;flex-direction:column;align-items:center;animation:fade .5s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px;line-height:1.2;margin:16px 0 18px;color:var(--red)}
.pic{width:100%;max-width:300px;border-radius:16px;box-shadow:0 10px 26px rgba(107,16,32,.3);display:block}
.round{width:58px;height:58px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:28px;cursor:pointer;margin:0 8px;box-shadow:0 6px 14px rgba(155,27,48,.35)}
.round:active{transform:scale(.94)}
.pill{font:inherit;font-size:18px;background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 6px 14px rgba(155,27,48,.35)}
.items{display:flex;flex-direction:column;align-items:center;gap:16px;margin:0 0 22px}
.item{background:none;border:0;cursor:pointer;position:relative;padding:0;display:block}
.item img{display:block;max-height:150px;max-width:260px;border-radius:12px;transition:transform .25s}
.item:hover img{transform:scale(1.04)}
.item.done::after{content:"✓";position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;width:26px;height:26px;border-radius:50%;font-size:16px;line-height:26px}
#next{visibility:hidden;opacity:0;transition:opacity .6s}
#next.show{visibility:visible;opacity:1}
.rose{max-height:62vh;max-width:70%;animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(3deg)}}
.foryou{font-style:italic;font-size:38px;color:var(--red);margin:10px 0 0}
.modal{position:fixed;inset:0;background:rgba(40,5,12,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
.modal.on{display:flex}
.box{background:var(--card);border-radius:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto;padding:20px;text-align:left;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.box h2{margin:0 0 12px;color:var(--red);text-align:center}
.song{padding:10px 0;border-bottom:1px dashed var(--soft)}
.song:last-of-type{border:0}
.song small{opacity:.75;display:block}
audio{width:100%;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(135deg,var(--soft),var(--bg2));display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph small{font-size:12px;opacity:.75;text-align:center;padding:6px}
.letter{line-height:1.65;font-size:17px}
.letter p{margin:0 0 12px}
.sign{text-align:right;color:var(--red);font-style:italic}
.close{display:block;margin:14px auto 0}
</style>
</head>

</main>
<div class="modal" id="m"><div class="box" id="mb"></div></div>

<script>
/* ================================================================
   ТЕКСТЫ — меняйте только то, что внутри кавычек "..."
   ================================================================ */
var TEXTS = {
  happy:  "Срочно, это для тебя! Нажми на галочку, иначе пожалеешь",
  sad:    "Ну пожалуйста, бро",
  next:   "Дальше",
  foryou: "for you"
};

/* Раздел «Песни». Для каждой песни: название, подпись, файл (src).
   src: "" — значит, плеер пока пустой. Можно добавить или убрать строки. */
var SONGS = [
  { title: "Wicked Games - The Weekend", note: "", src: "The Weekend - Wicked Games.mp3" },
  { title: "Ivy - Frank Ocean", note: "",        src: "Frank Ocean - Ivy.mp3" },
  { title: "One More - Ne-Yo", note: "",    src: "Ne-Yo - One More.mp3" }
];

/* Раздел «Фото». src: "" — показывается рамка-заглушка с подписью. */
var PHOTOS = [
  { src: "67.jpg", caption: "Подпись к фото 1" },
  { src: "мог.jpg", caption: "Подпись к фото 2" },
  { src: "деп.jpg", caption: "Подпись к фото 3" },
  { src: "птичка.jpg", caption: "Подпись к фото 4" }
];

/* Раздел «Письмо». Каждая строка в списке — отдельный абзац. */
var LETTER = {
  title: "мега текст",
  paragraphs: [
    "алина с днём рождения",
    "обычно я пишу поздравления по типу здоровья счастья и всего самого лучшего, но ты сподвигла меня постараться и написать что то более красивое чем это скудное типичное \"с др\"",
    "я вообще до сих пор удивлена как много нового произошло со мной в этот год, и хотя он ещё не окончился, могу сказать, что знакомство с тобой было ахуеть какое \"новое произошедшее\", одно из лучших за год.",
    "а вообще, главное, я надеюсь что будущий твой год будет наполнен эмоциями, неважно какими конечно, но лучше побольше положительных, потому что в любом случае все эмоции хороши как будто, доказывает что мы живые хз, и впечатлений побольше тоже кароче пусть будет и просто много нового и интересного, ну и старое доброе что либо тоже пусть остаётся , ведь это часть тебя в любом случае.",
    "ты невероятная в общем, невероятно красивая, невероятно ахуенная, невероятно невероятная💋",
    "с днём рождения"
  ],
  sign: ""
};
/* ================================================================
   Дальше идёт код. Его менять не нужно.
   ================================================================ */
(function(){
  function $(id){return document.getElementById(id);}
  $('t-happy').textContent=TEXTS.happy;
  $('t-sad').textContent=TEXTS.sad;
  $('next').textContent=TEXTS.next;
  $('t-foryou').textContent=TEXTS.foryou;

  function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('on',s.id===id);});}
  $('yes').onclick=function(){show('s3');};
  $('no').onclick=function(){show('s2');};
  $('back').onclick=function(){show('s1');};
  $('next').onclick=function(){show('s4');};

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
  var build={
    songs:function(box){
      box.appendChild(el('h2','','Песни, которые ассоциируются с тобой'));
      SONGS.forEach(function(s){
        var d=el('div','song');d.appendChild(el('b','',s.title));d.appendChild(el('small','',s.note));
        var a=el('audio');a.controls=true;a.preload='none';if(s.src)a.src=s.src;d.appendChild(a);box.appendChild(d);
      });
    },
    photos:function(box){
      box.appendChild(el('h2','','с днем рождения на языке сикссевен: 67 6767 6767676767'));
      var g=el('div','grid');
      PHOTOS.forEach(function(p){
        var d=el('div','ph');
        if(p.src){var i=el('img');i.src=p.src;i.alt=p.caption;d.appendChild(i);}
        else d.appendChild(el('small','',p.caption));
        g.appendChild(d);
      });
      box.appendChild(g);
    },
    letter:function(box){
      box.appendChild(el('h2','',LETTER.title));
      var d=el('div','letter');
      LETTER.paragraphs.forEach(function(t){d.appendChild(el('p','',t));});
      d.appendChild(el('p','sign',LETTER.sign));
      box.appendChild(d);
    }
  };

  var seen={},modal=$('m'),mb=$('mb');
  document.querySelectorAll('.item').forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.open;mb.innerHTML='';build[k](mb);
      var c=el('button','pill close','Закрыть');
      c.onclick=function(){
        modal.classList.remove('on');mb.innerHTML='';seen[k]=1;b.classList.add('done');
        if(Object.keys(seen).length===3)$('next').classList.add('show');
      };
      mb.appendChild(c);modal.classList.add('on');
    };
  });
})();
</script>
</body>
</html>
